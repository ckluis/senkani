name: release-build-smoke

# Catches dependency-pin / package-graph regressions before merge.
# Companion to `tests` (see test.yml) — release-mode build runs in
# its own job so a debug-mode test failure and a release-mode
# linker/import failure can be triaged independently. Either job
# failing blocks merge.
#
# Prior incident (2026-05-07): mlx-swift-lm@main advanced past the
# revision that vended `Tokenizers` transitively. Debug-mode builds
# happened to resolve, but `swift build -c release` failed with
# "no such module 'Tokenizers'" on every consumer. The pin SHA
# fixed the immediate breakage; this gate prevents a re-occurrence.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PR-trigger path filter (added 2026-06-27): run the ~12-13 min release
    # build on a PR ONLY when a dependency manifest changes.
    #
    # WHAT THIS GAINS — a dependency-pin / package-graph regression (the
    # 2026-05-07 `mlx-swift-lm@main` "no such module 'Tokenizers'" incident,
    # see header) can ONLY be introduced by a change to Package.swift or
    # Package.resolved: the build runs `swift package resolve`, honoring the
    # committed pins, and there are no branch-tracking pins, nested/vendored
    # manifests, or submodules. So on a source-only / docs-only / CI-only PR the
    # resolved graph is byte-identical and this release dep-graph check has
    # nothing new to catch — ~12-13 min skipped on most PRs.
    #
    # WHAT THIS TRADES (the honest cost) — `swift build -c release` is ALSO the
    # only PRE-merge job that (1) compiles in release mode (`-O` / whole-module
    # optimization) and (2) compiles the SenkaniMCP / SenkaniHook /
    # SenkaniMigHelper / SenkaniApp executable mains. The `tests` workflow runs
    # `swift test` (the test closure only, in debug) — it builds none of those
    # mains and never compiles in release mode. So after this filter a SOURCE-
    # only PR no longer gets release-mode + executable-main compile coverage
    # PRE-merge (e.g. an unguarded caller of a `#if DEBUG`-only symbol, or a
    # release-only optimizer/link failure, passes `tests` and fails only on
    # `main`). That coverage is intentionally moved to the `push: branches:
    # [main]` trigger above, which stays UNFILTERED and rebuilds in release on
    # every push to main as a post-merge backstop. Accepted trade: minutes off
    # most PRs for post-merge (not pre-merge) detection of release-only source
    # breakage. (A CI-only PR that bumps this workflow's own `swift-version`
    # pin is likewise non-manifest and skips here — caught by the same backstop.)
    #
    # Branch-protection note (verified 2026-06-27): `main` has no classic
    # branch protection and no rulesets, and repo auto-merge is disabled — so
    # the `swift build -c release` check is NOT a required status check and a
    # path-filtered run (the run is simply not created) cannot wedge any merge
    # today. IF this check is ever added to a required-status-checks list, a
    # path-filtered required check reports no status and GitHub holds it Pending,
    # which WILL block / wedge auto-merge. Resolve that BEFORE requiring it, by:
    #   (a) keeping this check non-required — let the `tests` workflow's
    #       `Build & test (summary)` aggregator be the required gate; or
    #   (b) converting this to an always-run job whose expensive build steps
    #       are gated on a dorny/paths-filter manifest check, so the job
    #       always reports a result and is immune to the skipped-required wedge.
    paths:
      - Package.swift
      - Package.resolved

permissions:
  contents: read

# Per-commit backstop on push:main (ci-release-smoke-concurrency-cancel-push-main-2026-06-27).
#
# This run is now load-bearing: the PR path filter above (Package.swift / Package.resolved
# only) moved release-mode (`-O` / WMO) + executable-main compile coverage OFF source-only PRs
# and onto this `push: branches: [main]` backstop. So each landed main commit deserves its OWN
# completed release build — a cancelled intermediate-commit run means a release-only source
# breakage on that commit goes uncaught until the tip.
#
# Keying the PUSH group on `github.sha` gives every main commit its own concurrency group, so
# two (or three+) merges landing <13 min apart never cancel — and never pending-supersede —
# each other's release run. Worst case is more concurrent runner minutes (main pushes are
# infrequent merges), NEVER fewer-than-intended backstop builds.
#
# PR behavior is UNCHANGED: for `pull_request`, `github.ref` is `refs/pull/<n>/merge`, so the
# group is per-PR and `cancel-in-progress: true` still supersedes a stale run when a PR branch
# is force-pushed (the correct, desired behavior for PR refs). The `&& ... ||` form is the
# standard Actions ternary; `github.sha` is always a non-empty 40-char hex string, so it is
# never the falsy operand that would make the idiom fall through to `github.ref`.
concurrency:
  group: release-build-smoke-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: swift build -c release
    runs-on: macos-15
    # `swift build -c release` of the full MLX dependency graph runs ~12-13
    # min on a cold cache; 15 min left no headroom for checkout + toolchain
    # install + resolve + binary-verify and intermittently timed out
    # (build completed, job cancelled). 25 gives margin.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 6.3
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Cache key includes both Package.resolved and Package.swift.
      # Package.resolved alone is insufficient: a manually-bumped pin
      # SHA in Package.swift produces a new resolved file but a
      # branch-tracking dependency could surface an identical
      # resolved hash while the consumer code drifts. Hashing both
      # forces re-resolve on either source of change.
      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
            .swiftpm/configuration/checkouts
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-

      - name: Resolve dependencies
        run: swift package resolve

      - name: swift build -c release
        run: swift build -c release

      # Assert every executable target produced a binary that exists
      # and is executable. A linker-stage failure that emits an exit
      # code 0 but no binary (rare, but observed historically with
      # SwiftPM under partial-resolution conditions) would otherwise
      # slip past the previous step.
      - name: Verify release binaries
        run: |
          set -euo pipefail
          for bin in senkani senkani-mcp senkani-hook senkani-mig-helper; do
            path=".build/release/${bin}"
            if [[ ! -x "${path}" ]]; then
              echo "::error::release binary missing or not executable: ${path}"
              ls -la .build/release/ || true
              exit 1
            fi
            echo "ok: ${path} ($(stat -f%z "${path}") bytes)"
          done
