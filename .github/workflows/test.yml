name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix fan-out: each of the 5 named groups defined in
  # `tools/test-safe.sh` runs in its own GH Actions job. Wall-clock
  # for the workflow as a whole is bounded by the slowest single
  # chunk, not by the sum of all chunks. SwiftPM build cache is
  # shared across slots via the `actions/cache@v4` key on
  # `Package.resolved` — every job should hit the cache on a no-deps PR.
  #
  # CHUNK COUNT = 5 to fit ONE runner wave (ci-test-yml-build-once-
  # test-many-2026-06-27): GitHub-hosted macOS enforces an account
  # concurrent-runner cap (~5 observed), so the previous 8-chunk matrix
  # queued through ~2 waves (~35 min wall-clock). Five chunks run
  # concurrently in a single wave (on a PR, Item 1's path filter keeps
  # release-build-smoke from competing for a slot), cutting wall-clock
  # to ~the slowest single chunk (~22 min). The four named groups are
  # balanced by measured TEST time in `tools/test-safe.sh`; "other" is
  # the catch-all and the bottleneck (wasmtime integration).
  #
  # `chunk:` list is hard-coded here to keep the workflow self-
  # contained and reviewable. Keep in lockstep with the `CHUNKS`
  # array in `tools/test-safe.sh`. Renames or additions to that
  # array require a matching edit here. The single-source-of-truth
  # alternative (workflow-output pre-job emitting `--list-chunks`)
  # was rejected on simplicity grounds during scope-groom (build
  # round 2026-05-18): drift risk is small, reviewability win is
  # large.
  chunk:
    name: chunk[${{ matrix.chunk }}]
    # macos-15 ships Xcode 16.4 / Swift 6.1.2 by default. The project
    # is developed against Swift 6.3 — 6.1's stricter actor-isolation
    # enforcement flagged dozens of legitimate-on-6.3 sites. Pinning
    # the runner toolchain to 6.3 (Bach: "match the local environment")
    # closes that gap without retrofitting hundreds of source sites.
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - parsers-kb
          - learning-session
          - onboarding-pane
          - hook
          - other
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SwiftyLab/setup-swift is the actively maintained successor to
      # swift-actions/setup-swift (the latter's version registry stops at
      # ~6.0 — `swift-version: "6.3"` returned "not available" in
      # iteration #4). SwiftyLab tracks current swift.org releases.
      - name: Install Swift 6.3
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The T.3a runtime-sandbox integration tests (WasmtimeRuntimeIntegration
      # + the WASI echo test) live in the `other` chunk and shell out to the
      # real `wasmtime` binary; without it they fail `wasmtime_missing`. The
      # `.wasm` fixtures are committed (bundled via Bundle.module) — only the
      # binary is missing on the runner. Install it for that slot only; the
      # other 4 chunks don't exercise wasmtime.
      - name: Install wasmtime (chunk[other] sandbox integration)
        if: matrix.chunk == 'other'
        run: brew install wasmtime

      # Run the single chunk this matrix slot owns. `--chunk $name`
      # invokes one `swiftpm-testing-helper` process scoped to that
      # chunk's regex; the per-chunk SIGTRAP-retry envelope
      # (`TEST_SAFE_RETRIES`, default 3) lives inside the script.
      - name: Build & test (chunk[${{ matrix.chunk }}])
        run: ./tools/test-safe.sh --chunk ${{ matrix.chunk }}

  # Branch-protection aggregator. One check, depends on every
  # chunk job. If any chunk red-lines, `summary` red-lines.
  # Operator post-merge: re-point branch protection from the
  # retired `Build & test` check to `Build & test (summary)`.
  summary:
    name: Build & test (summary)
    needs: chunk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate chunk results
        env:
          NEEDS_RESULT: ${{ needs.chunk.result }}
        run: |
          echo "matrix result: $NEEDS_RESULT"
          if [ "$NEEDS_RESULT" != "success" ]; then
            echo "::error title=chunk-matrix-failed::one or more chunks failed; see chunk[*] job logs"
            exit 1
          fi

      # Diagnostic surface: print the chunk regex table in the
      # summary job log so reviewers reading a failed run can see
      # what's in each chunk without spelunking individual job
      # logs.
      - name: Chunk inventory (for log archaeology)
        if: always()
        run: ./tools/test-safe.sh --list-chunks
